name: 更新国内IP分组（新版爱快）

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 0 点（北京时间 8 点）
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-ipgroups:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: 设置Python环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 运行生成脚本
        run: |
          python ikuai_ipgroups.py
          echo "=== 生成后文件列表 ==="
          ls -l *.txt || true

      - name: 检查文件变化
        id: check_changes
        run: |
          git status --porcelain
          echo "changes=$(git status --porcelain | wc -l)" >> $GITHUB_OUTPUT

      - name: 提交并推送更新
        if: steps.check_changes.outputs.changes > 0
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ikuai_cn_ipv4group.txt ikuai_cn_ipv6group.txt
          git commit -m "自动更新新版爱快IP分组 $(date +'%Y-%m-%d')"
          git push origin HEAD:main
