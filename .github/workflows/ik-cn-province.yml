name: 每日更新爱快省份IP分组（新版）

on:
  schedule:
    # 每天北京时间02:00（UTC 18:00）
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-province-ipgroup:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: main

      - name: 配置Python 3.10
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行生成脚本
        run: |
          python ikai_cni_p.py
          echo "=== 生成后文件列表 ==="
          ls -l ikuai_cn_province_ipgroup.txt || { echo "ERROR: 文件未生成"; exit 1; }

      - name: 提交并推送更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ikuai_cn_province_ipgroup.txt
          if git diff --cached --quiet; then
            echo "=== 无文件修改，无需提交 ==="
            exit 0
          fi
          git commit -m "每日自动更新新版爱快省份IP分组（${{ github.run_started_at }}）"
          git push origin HEAD:main
