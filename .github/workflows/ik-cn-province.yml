name: 每日更新爱快省份IP分组（新版）

on:
  schedule:
    # 每天北京时间02:00（UTC 18:00）
    - cron: '0 18 * * *'
  workflow_dispatch:

jobs:
  update-province-ipgroup:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 执行生成脚本
        run: |
          python ikai_cni_p.py
          if [ ! -f "ikuai_cn_province_ipgroup.txt" ]; then
            echo "ERROR: 目标文件 ikuai_cn_province_ipgroup.txt 未生成！"
            ls -l
            exit 1
          fi

      - name: 提交并推送更新
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add ikuai_cn_province_ipgroup.txt
          if git diff --cached --quiet; then
            echo "=== 无文件修改，无需提交 ==="
            exit 0
          fi
          git stash
          git pull origin main --rebase
          git stash pop
          git add ikuai_cn_province_ipgroup.txt
          git commit -m "每日自动更新新版爱快省份IP分组（${{ github.run_started_at }}）"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
